# Blackbox: nginx side of request tracing.
#
# http {} context: include this file, then add `access_log ... blackbox;`
# and the fastcgi lines below to your PHP location.

# Keep an incoming X-Request-Id (e.g. from a load balancer); otherwise use nginx's own.
map $http_x_request_id $blackbox_request_id {
    ""      $request_id;
    default $http_x_request_id;
}

log_format blackbox escape=json '{'
    '"ts":"$time_iso8601",'
    '"request_id":"$blackbox_request_id",'
    '"session_id":"$http_x_session_id",'
    '"ip":"$remote_addr",'
    '"forwarded_for":"$http_x_forwarded_for",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_length":$request_length,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"'
'}';

# --- inside server {} ---
# access_log /var/log/nginx/blackbox.jsonl blackbox;
# add_header X-Request-Id $blackbox_request_id always;
#
# --- inside location ~ \.php$ {} ---
# fastcgi_param HTTP_X_REQUEST_ID $blackbox_request_id;
# fastcgi_hide_header X-Request-Id;   # PHP sends it too; nginx's add_header covers 502/504 as well
#
# Note: add_header in a location replaces every add_header inherited from server {}.
